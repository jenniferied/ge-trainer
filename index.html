<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171425">
  <title>GE-Trainer</title>
  <script>
    // Theme vor dem ersten Paint setzen (kein Aufblitzen). Standard: Nachtmodus.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("ge-trainer-v1") || "{}");
        if (s.theme === "hell") document.documentElement.setAttribute("data-theme", "hell");
      } catch (e) { /* Standard bleibt dunkel */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fraunces 900 gehoert dazu, seit die Ueberschriften-Hierarchie im geteilten
       Paket steht (geteilt.css, Block 7b: h1 { font-weight: 900 }). Ohne das
       Gewicht faellt die h1 still auf einen synthetisch fett gerechneten
       700er-Schnitt zurueck - sichtbar anders als im ST-Trainer, ohne Fehler. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Geteiltes Style-Paket beider Trainer (Farbleiter, Muster "offen/erledigt",
       Plot-Punkte). Quelle: rose/geteilte-styles/trainer-muster.css — diese Kopie
       NICHT bearbeiten, sondern die Quelle und dann verteilen.sh laufen lassen.
       Muss VOR style.css stehen, damit App-eigene Abweichungen spaeter greifen. -->
  <link rel="stylesheet" href="css/geteilt.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Handschrift-Font (Caveat, self-hosted) und die Papier-Optik des Klausurmodus.
       Beide werden auch im Uebungsmodus gebraucht (.handschrift im Frei-ueben-Feld,
       .kl-ov/.kl-dialog fuer die Stift-Flaeche), deshalb statisch statt zur Laufzeit. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/papier.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="laden">Einen Moment, die Fragen werden geladen &hellip;</div>
  </div>
  <script>
  // Fehler sichtbar machen statt weisser Seite (hilft beim Debuggen, v.a. mobil).
  // Wortgleich mit dem ST-Trainer (dessen index.html), damit ein Absturz in beiden
  // Apps dasselbe zeigt: bis zum 12.08. hatte nur der ST-Trainer diese Box, der
  // GE-Trainer waere bei einem Modul-Fehler still weiss geblieben. Die Box haengt
  // NICHT am Theme - sie soll auch dann noch lesbar sein, wenn das CSS schuld ist.
  window.addEventListener("error", function (e) {
    var app = document.getElementById("app");
    if (!app) return;
    var box = document.createElement("div");
    box.style.cssText = "margin:16px;padding:14px;border:2px solid #b3362b;border-radius:12px;background:#fbe7e4;color:#7a2018;font:14px/1.5 monospace;white-space:pre-wrap;word-break:break-word";
    box.textContent = "Fehler: " + (e.message || e.type) + (e.filename ? "\n" + e.filename.split("/").pop() + ":" + e.lineno : "");
    app.appendChild(box);
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.dispatchEvent(new ErrorEvent("error", { message: String(e.reason && e.reason.message || e.reason) }));
  });
  </script>
  <!-- rough-notation (vendored, klassisches IIFE -> window.RoughNotation) fuer den
       Rotstift-Look der Korrektur. defer laeuft vor dem Modul-Skript, klausur.js
       fragt trotzdem ueber rn() ab - fehlt es, bleibt die Korrektur schlicht. -->
  <script defer src="vendor/rough-notation.iife.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
